<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Sphere Animation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<script>
    // 1. Sahne, Kamera ve Renderer Kurulumu
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 12;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    
    // YENİ: Kuyruk (trail) efekti için her karede ekranın otomatik temizlenmesini kapatıyoruz
    renderer.autoClear = false; 
    
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05; // Daha akıcı bir dönüş hissi

    // YENİ: Fareyle hızlı döndürürken derinlik yırtılmalarını önler
    controls.addEventListener('change', () => {
        renderer.clearDepth();
    });

    // 2. Videodaki Renk Paleti (Birebir)
    const sphereColors = [
        new THREE.Color(0x00ffff).multiplyScalar(1.2),
        new THREE.Color(0xfff400).multiplyScalar(1.1),
        new THREE.Color(0x410beb).multiplyScalar(1.2),
        new THREE.Color(0xff09b4).multiplyScalar(1.1),
        new THREE.Color(0x00ff00).multiplyScalar(1.2)
    ];

    // 3. Videoda Eksik Olan "createOrbitRings" Fonksiyonunun Yazılması
    function createOrbitRings(innerRadius, outerRadius, width) {
        const group = new THREE.Group();
        const particleCount = 4000; // Toplam parçacık sayısı
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
            // Rastgele açı ve yarıçap ile halka formu oluşturma
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            
            // Küresel dağılım yerine halka ve merkez küre karışımı bir dağılım
            let radius = innerRadius + Math.random() * (outerRadius - innerRadius);
            
            // Parçacıkların bir kısmını iç küreye, bir kısmını dış halkaya dağıtıyoruz
            if(Math.random() > 0.4) {
                // Halka formu (Düzlemde yoğunlaşma)
                positions[i * 3] = radius * Math.cos(theta);
                positions[i * 3 + 1] = (Math.random() - 0.5) * width;
                positions[i * 3 + 2] = radius * Math.sin(theta);
            } else {
                // Merkezdeki Küre formu
                const r = 3.5 * Math.pow(Math.random(), 0.5);
                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = r * Math.cos(phi);
            }

            // Listeden rastgele bir renk seçip parçacığa atama
            const randomColor = sphereColors[Math.floor(Math.random() * sphereColors.length)];
            colors[i * 3] = randomColor.r;
            colors[i * 3 + 1] = randomColor.g;
            colors[i * 3 + 2] = randomColor.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // Parçacıkların görünümü (Glow / Parlama efekti için yuvarlak texture taklidi)
        const material = new THREE.PointsMaterial({
            size: 0.07,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending, // Renklerin üst üste binince parlamasını sağlar
            depthWrite: false
        });

        const points = new THREE.Points(geometry, material);
        group.add(points);
        return group;
    }

    // Fonksiyonu videodaki parametrelerle çağırıyoruz (5.8, 6, 0.4)
    const orbitRings = createOrbitRings(5.8, 6, 0.4);
    scene.add(orbitRings);

    // --- YENİ EKLEME: MERKEZ KÜRE (GLOW CORE) ---
    // Parçacıkların tam ortasında parlayacak yarı şeffaf neon küre
    const coreGeometry = new THREE.SphereGeometry(3.2, 32, 32); 
    const coreMaterial = new THREE.MeshBasicMaterial({
        color: 0x00ffff,                  
        transparent: true,
        opacity: 0.35,                    
        blending: THREE.AdditiveBlending  
    });
    const centerCore = new THREE.Mesh(coreGeometry, coreMaterial);
    scene.add(centerCore);

    // --- YENİ EKLEME: ARKA PLAN YILDIZLARI (STARFIELD) ---
    const starCount = 3000;
    const starGeometry = new THREE.BufferGeometry();
    const starPositions = new Float32Array(starCount * 3);

    for (let i = 0; i < starCount; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);
        const distance = 400 + Math.random() * 200; // Sahneden uzaklık katmanı

        starPositions[i * 3] = distance * Math.sin(phi) * Math.cos(theta);
        starPositions[i * 3 + 1] = distance * Math.sin(phi) * Math.sin(theta);
        starPositions[i * 3 + 2] = distance * Math.cos(phi);
    }

    starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));

    const starMaterial = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.5,
        transparent: true,
        opacity: 0.6,
        sizeAttenuation: true 
    });

    const backgroundStars = new THREE.Points(starGeometry, starMaterial);
    scene.add(backgroundStars);

    // 4. Videodaki Animasyon Döngüsü (Geliştirilmiş)
    let time = 0;
    const initialCamY = camera.position.y; // Kamera salınımı için ilk yer işareti

    function animate() {
        requestAnimationFrame(animate);
        
        time += 0.002;
        
        // YENİ: Kuyruk efekti için her karede derinliği temizle
        renderer.clearDepth();
        
        // Orbit rings animation example (Orijinal dönüş)
        orbitRings.rotation.y = time;
        orbitRings.rotation.x = time * 0.3;
        
        // YENİ: Merkez küre nefes alma efekti (Pulse)
        const pulse = 1 + Math.sin(time * 4) * 0.03; 
        centerCore.scale.set(pulse, pulse, pulse);
        
        // YENİ: Arka plan yıldızlarının yavaşça süzülmesi (Parallax)
        backgroundStars.rotation.y = time * 0.02;
        backgroundStars.rotation.x = time * 0.01;
        
        // YENİ: Kameranın uzayda hafifçe süzülmesi (Breathing)
        camera.position.y = initialCamY + Math.sin(time * 2) * 0.4;
        
        controls.update();
        renderer.render(scene, camera);
    }

    // Pencere boyutu değiştiğinde sahneyi güncelle
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        
        // YENİ: Boyut değişiminde biriken kare artıklarını temizler
        renderer.clear(); 
    });

    // Animasyonu başlat
    animate();
</script>

</body>
</html>
